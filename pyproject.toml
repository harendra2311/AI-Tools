[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tools"
version = "0.1.0"
description = "A collection of AI utilities and tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-tools = "ai_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
